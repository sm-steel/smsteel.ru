name: Deploy

on:
  push:
    branches: [main]
    # Documentation never reaches the host: the deploy rsyncs `dist/`, and
    # nothing here is compiled into the build. A docs-only commit therefore
    # has nothing to deploy, and running the pipeline for one only burns a
    # build and opens an SSH session to moscow for a byte-identical rsync.
    #
    # `**/*.md` rather than a fixed filename list, so any future doc file
    # anywhere in the repo is covered automatically. Note paths-ignore skips
    # a push only when *every* changed file matches -- a commit touching
    # both README.md and src/ still deploys.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - ".agents/**"
  # Not path-filtered: a manual run means "deploy now," whatever the last
  # commit happened to touch. Also the escape hatch if a docs-only commit
  # ever does need to reach the host.
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin Moscow host key
        run: |
          mkdir -p ~/.ssh
          echo "moscow.smsteel.ru ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINePbOeXsvuZN8mleEybPOdZS6S0XyXcvJRIJ3ZftGde" >> ~/.ssh/known_hosts

      # The deploy user's SSH key is locked server-side to `rrsync` scoped
      # to /opt/smsteel/dist (see /home/deploy/.ssh/authorized_keys on
      # Moscow) — the rsync destination is therefore a bare colon (rrsync's
      # restricted root), not the absolute path repeated.
      #
      # Assets are synced first (with --delete, to prune stale hashed
      # filenames from old builds), index.html last, so there's never a
      # moment where a served index.html references an asset that hasn't
      # landed yet.
      - name: Deploy assets
        run: |
          rsync -avz --delete --exclude index.html dist/ deploy@moscow.smsteel.ru:

      - name: Deploy index.html
        run: |
          rsync -avz dist/index.html deploy@moscow.smsteel.ru:index.html

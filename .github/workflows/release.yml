name: Release

# Push to main (a develop -> main release PR merge): semantic-release decides
# the version from Conventional Commits since the last tag and creates the
# tag + GitHub release. If one was cut, the `build` job builds THAT tag,
# smoke-tests the image, and only then pushes it. A release does NOT deploy
# -- a separate deployer repo pins the version; deploying is a bump PR there.
#
# Recovery: semantic-release tags before the image exists, so if the build or
# push fails, a re-run cuts nothing new. Rebuild the existing tag instead:
#   gh workflow run release.yml -f version=X.Y.Z
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Rebuild and push the image for an EXISTING release tag (X.Y.Z), e.g. after a failed push"
        required: true

permissions:
  contents: read

jobs:
  # Runs semantic-release (and its npm dependencies) with the rights it needs
  # for tags, releases and its issue/PR comments -- but not packages: write.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.new_release_published == 'true' && steps.release.outputs.new_release_version || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semantic release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    # After a push: only when a release was cut. Manually: always (release is
    # skipped then, hence !failure() rather than the implicit success()).
    if: ${{ !cancelled() && !failure() && (needs.release.outputs.version != '' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version || inputs.version }}
    steps:
      - name: Validate the version and that its tag exists
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
          git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION" >/dev/null \
            || { echo "::error::no tag v$VERSION"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ env.VERSION }}
      - name: Build and smoke-test the image (read-only, non-root, SPA fallback, version)
        run: |
          docker build --build-arg VERSION="$VERSION" -t "ghcr.io/sm-steel/smsteel-web:$VERSION" .
          bash tests/image/smoke.sh "ghcr.io/sm-steel/smsteel-web:$VERSION" "$VERSION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        run: docker push "ghcr.io/sm-steel/smsteel-web:$VERSION"

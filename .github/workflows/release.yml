name: Release

# Push to main (a develop -> main release PR merge): semantic-release
# decides the version from Conventional Commits since the last tag and
# creates the tag + GitHub release; only if a release was cut is the image
# built and pushed. A release does NOT deploy -- a separate deployer repo
# pins the version; deploying is a version-bump PR there.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semantic release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.new_release_published == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.release.outputs.new_release_published == 'true'
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.release.outputs.new_release_version }}
          tags: ghcr.io/sm-steel/smsteel-web:${{ steps.release.outputs.new_release_version }}

name: Checks

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Image smoke test (read-only, non-root, SPA fallback, version)
        run: |
          docker build --build-arg VERSION=ci-${{ github.sha }} -t smsteel-web:ci .
          bash tests/image/smoke.sh smsteel-web:ci "ci-${{ github.sha }}"

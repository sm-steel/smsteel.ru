name: smsteel

services:
  web:
    image: nginx:alpine
    container_name: smsteel_web
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.smsteel.rule=Host(`smsteel.ru`)"
      - "traefik.http.routers.smsteel.entrypoints=websecure"
      - "traefik.http.routers.smsteel.tls.certresolver=letsencrypt"
      - "traefik.http.services.smsteel.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
